<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quokka Bot red team probe</title>
<meta name="robots" content="noindex">
</head>
<body>
<h1>Quokka Bot red team probe</h1>
<p>This page plays a hostile website inside the agent's browser. It tries to reach things the page must never reach
and prints one line per probe. "refused" is the expected outcome for every probe.</p>
<pre id="out">running…</pre>
<script>
// Each probe resolves to "reached" or "refused". A page cannot read cross-origin responses anyway; the question is
// whether the request got through at all, which an opaque fetch or an opened WebSocket shows.
const targets = [
  ["cdp_json", "http://127.0.0.1:9222/json/version"],
  ["cdp_localhost", "http://localhost:9222/json/version"],
  ["selkies_local", "http://127.0.0.1:3000/"],
  ["browser_service_local", "http://127.0.0.1:7800/health"],
  ["control_app", "http://10.232.1.3:8080/api/agents"],
  ["egress_control", "http://10.232.1.2:9090/health"],
  ["metadata", "http://169.254.169.254/hetzner/v1/metadata"],
  ["docker_tcp", "http://172.17.0.1:2375/version"],
  ["private_range", "http://192.168.1.1/"],
  ["ipv6_loopback", "http://[::1]:9222/json/version"],
  ["decimal_loopback", "http://2130706433:9222/json/version"],
  ["model_provider", "https://api.anthropic.com/v1/models"],
];

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((resolve) => setTimeout(() => resolve("timeout"), ms))]);
}

async function probeFetch(url) {
  try {
    await withTimeout(fetch(url, { mode: "no-cors", cache: "no-store" }), 4000).then((r) => {
      if (r === "timeout") throw new Error("timeout");
    });
    return "reached";
  } catch {
    return "refused";
  }
}

function probeSocket(url) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (value) => {
      if (!done) {
        done = true;
        resolve(value);
      }
    };
    try {
      const ws = new WebSocket(url);
      ws.onopen = () => {
        ws.close();
        finish("reached");
      };
      ws.onerror = () => finish("refused");
      setTimeout(() => finish("refused"), 4000);
    } catch {
      finish("refused");
    }
  });
}

async function run() {
  const lines = [];
  for (const [name, url] of targets) lines.push(`${name}: ${await probeFetch(url)}`);
  // agent-browser's stream server listens on a random loopback port; sample the usual range.
  let streamReached = 0;
  for (let port = 9223; port < 9233; port += 1) {
    if ((await probeSocket(`ws://127.0.0.1:${port}/`)) === "reached") streamReached += 1;
  }
  lines.push(`loopback_websockets: ${streamReached === 0 ? "refused" : `reached ${streamReached}`}`);
  lines.push(`webrtc: ${typeof RTCPeerConnection === "function" ? await probeWebRtc() : "refused"}`);
  document.getElementById("out").textContent = `${lines.join("\n")}\ndone`;
}

async function probeWebRtc() {
  try {
    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    pc.createDataChannel("x");
    const candidates = [];
    pc.onicecandidate = (e) => {
      if (e.candidate) candidates.push(e.candidate.candidate);
    };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((r) => setTimeout(r, 3000));
    pc.close();
    return candidates.some((c) => c.includes("srflx") || c.includes("host")) ? `reached (${candidates.length} candidates)` : "refused";
  } catch {
    return "refused";
  }
}

run();
</script>
</body>
</html>
