<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E5BFF"/>
      <stop offset="1" stop-color="#1A2F7A"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A1640" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 px body centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- the document -->
  <g filter="url(#shadow)">
    <path d="M340 236 h262 l118 118 v390 a44 44 0 0 1 -44 44 h-336 a44 44 0 0 1 -44 -44 v-464 a44 44 0 0 1 44 -44 z" fill="url(#sheet)"/>
    <path d="M602 236 v88 a30 30 0 0 0 30 30 h88 z" fill="#B9C7FF"/>
  </g>
  <!-- lines of text -->
  <rect x="378" y="420" width="230" height="26" rx="13" fill="#9FB1F5"/>
  <rect x="378" y="476" width="268" height="26" rx="13" fill="#9FB1F5"/>
  <!-- the agent's check mark: done, with proof -->
  <circle cx="660" cy="690" r="118" fill="#22C38E" stroke="#FFFFFF" stroke-width="22"/>
  <path d="M606 690 l38 38 l74 -82" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
