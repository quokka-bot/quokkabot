<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <title>Connect to Quokka Bot</title>
    <link rel="stylesheet" href="connect.css">
    <script src="connect.js" defer></script>
  </head>
  <body>
    <main>
      <svg class="logo" width="56" height="56" viewBox="222 192 580 580" aria-hidden="true"><rect x="279.375" y="290.5" width="470" height="66" rx="33" transform="rotate(-7 514.375 323.5)" fill="#0f1417"/><rect x="232" y="402" width="560" height="300" rx="118" fill="#0f1417"/><ellipse cx="452" cy="552" rx="42" ry="75" fill="#fff"/><ellipse cx="662" cy="552" rx="42" ry="75" fill="#fff"/></svg>
      <h1>Your agents, on your server.</h1>
      <p>Enter your Quokka Bot server address to connect.</p>
      <form id="connect-form">
        <label for="server-origin">Server address</label>
        <input id="server-origin" name="server" type="url" placeholder="https://quokkabot.example.com" required autocomplete="url" spellcheck="false" autofocus>
        <button id="connect-button" type="submit">Connect</button>
        <p id="error" role="alert" aria-live="polite"></p>
      </form>
      <small id="version"></small>
    </main>
  </body>
</html>
