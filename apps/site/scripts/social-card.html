<!doctype html>
<!-- The link preview image (public/social-card.png, 1200x630). Regenerate: open this file in a browser at
     1200x630 (device scale 1) and save a screenshot of the page as public/social-card.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, sans-serif; color: #1c1c1c;
    background: radial-gradient(900px 520px at 85% 110%, rgb(131 81 228 / .28), transparent 70%), linear-gradient(180deg, #fcfcfc, #f3eefc); }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; }
  h1 { position: absolute; left: 72px; top: 170px; width: 520px; margin: 0; font-size: 66px; line-height: 1.04; letter-spacing: -0.045em; font-weight: 750; }
  p { position: absolute; left: 72px; top: 352px; width: 470px; margin: 0; font-size: 25px; line-height: 1.4; color: #4b4b4b; }
  .shot { position: absolute; left: 620px; top: 92px; width: 700px; border-radius: 16px; overflow: hidden; background: #fff;
    box-shadow: 0 2px 4px rgb(24 16 48 / .06), 0 30px 70px rgb(68 32 150 / .25); outline: 1px solid rgb(0 0 0 / .06); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="brand"><img src="../public/icon.svg" alt="">Quokka Bot</div>
  <h1>An AI agent with its own computer.</h1>
  <p>Open source. Runs on one server, on your own Claude plan.</p>
  <div class="shot"><img src="../src/assets/screens/chat-focus.webp" alt=""></div>
</body>
</html>
