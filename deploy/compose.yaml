# Quokka Bot trusted containers. install.sh writes the values below into /etc/quokkabot/quokkabot.env and runs
#   docker compose --project-directory <repo>/deploy --env-file /etc/quokkabot/quokkabot.env up -d
# (the quokkabot-compose wrapper it installs does exactly that). The agent sandboxes (cli, tools, browser) are
# created by the supervisor from its own templates, never by Compose.
#
# Addresses are fixed: the egress proxy and the control plane bind to their address on each network, and the host
# firewall matches the sandbox bridges by name (qbc<N>, qbb<N>). Each agent slot's networks, and the control plane's
# and egress proxy's places on them, are in compose.agents.yaml, which install.sh generates next to quokkabot.env.

name: quokkabot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      QUOKKABOT_DOMAIN: ${QUOKKABOT_DOMAIN:?set QUOKKABOT_DOMAIN}
      QUOKKABOT_VIEW_DOMAIN: ${QUOKKABOT_VIEW_DOMAIN:?set QUOKKABOT_VIEW_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${QUOKKABOT_DATA:-/var/lib/quokkabot}/caddy/data:/data
      - ${QUOKKABOT_DATA:-/var/lib/quokkabot}/caddy/config:/config
    networks:
      edge:
        ipv4_address: 10.230.0.2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - control
    logging: *logging

  db:
    image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    user: "999:999"
    environment:
      POSTGRES_USER: quokkabot_owner
      POSTGRES_DB: quokkabot
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    volumes:
      - ${QUOKKABOT_DATA:-/var/lib/quokkabot}/db:/var/lib/postgresql/data
      - ${QUOKKABOT_ETC:-/etc/quokkabot}/secrets/by-service/db:/run/secrets:ro
    networks:
      - db
    shm_size: 256m
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999,mode=0775
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "quokkabot_owner", "--dbname", "quokkabot"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  control:
    image: quokkabot/control:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: control
      # Reproducible ids: a rebuild from cache keeps the image, so install.sh recreates only what changed.
      args:
        SOURCE_DATE_EPOCH: "0"
      provenance: false
      sbom: false
    restart: unless-stopped
    user: "10001:10001"
    # Group 1000 owns the supervisor's unix socket (0660) and the published downloads directory (0775).
    group_add: ["1000"]
    environment:
      QUOKKABOT_CONTROL_CONFIG: /etc/quokkabot/control.json
    volumes:
      - ${QUOKKABOT_ETC:-/etc/quokkabot}/control.json:/etc/quokkabot/control.json:ro
      - ${QUOKKABOT_ETC:-/etc/quokkabot}/secrets/by-service/control:/run/secrets:ro
      - ${QUOKKABOT_DATA:-/var/lib/quokkabot}/supervisor-socket:/run/quokkabot-supervisor
      # Desktop app builds for the update feed; written only by the publish script on the host.
      - ${QUOKKABOT_DATA:-/var/lib/quokkabot}/desktop:/data/desktop:ro
    networks:
      edge:
        ipv4_address: 10.230.0.3
      db: {}
      ctl:
        ipv4_address: 10.230.2.3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
      egress:
        condition: service_started
      supervisor:
        condition: service_started
    logging: *logging

  egress:
    image: quokkabot/egress:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: egress
      # Reproducible ids: a rebuild from cache keeps the image, so install.sh recreates only what changed.
      args:
        SOURCE_DATE_EPOCH: "0"
      provenance: false
      sbom: false
    restart: unless-stopped
    user: "10002:10002"
    environment:
      QUOKKABOT_EGRESS_CONFIG: /etc/quokkabot/egress.json
    volumes:
      - ${QUOKKABOT_ETC:-/etc/quokkabot}/egress.json:/etc/quokkabot/egress.json:ro
      - ${QUOKKABOT_ETC:-/etc/quokkabot}/secrets/by-service/egress:/run/secrets:ro
    networks:
      # `out` is the only network with a route to the internet; every listener is bound to one address below.
      out: {}
      ctl:
        ipv4_address: 10.230.2.2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  supervisor:
    image: quokkabot/supervisor:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: supervisor
      # Reproducible ids: a rebuild from cache keeps the image, so install.sh recreates only what changed.
      args:
        SOURCE_DATE_EPOCH: "0"
      provenance: false
      sbom: false
    restart: unless-stopped
    # uid 1000 matches the sandbox user, so files it writes for the CLI need no chown privilege. The Docker
    # socket's group gives it the Engine API and nothing else.
    user: "1000:1000"
    group_add: ["${DOCKER_GID:?set DOCKER_GID to the group id of /var/run/docker.sock}"]
    network_mode: none
    environment:
      QUOKKABOT_SUPERVISOR_CONFIG: /etc/quokkabot/supervisor.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out: the paths it hands to Docker for sandbox mounts are host paths.
      - ${QUOKKABOT_DATA:-/var/lib/quokkabot}:${QUOKKABOT_DATA:-/var/lib/quokkabot}
      - ${QUOKKABOT_DATA:-/var/lib/quokkabot}/supervisor-socket:/run/quokkabot-supervisor
      - ${QUOKKABOT_ETC:-/etc/quokkabot}/supervisor.json:/etc/quokkabot/supervisor.json:ro
      - ${QUOKKABOT_ETC:-/etc/quokkabot}/secrets/by-service/supervisor:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  edge:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: qb-edge
    ipam:
      config:
        - subnet: 10.230.0.0/24
  db:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: qb-db
    ipam:
      config:
        - subnet: 10.230.1.0/24
  ctl:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: qb-ctl
    ipam:
      config:
        - subnet: 10.230.2.0/24
  out:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: qb-out
    ipam:
      config:
        - subnet: 10.230.3.0/24
