name: Site

# Builds quokkabot.com (apps/site) and deploys it to Cloudflare Pages when main changes it. The build job has no
# secrets; only the deploy job sees the token, through the site environment, which only main can use.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/site.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @quokkabot/site...
      - run: pnpm --filter @quokkabot/site build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: site
      url: https://quokkabot.com
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 pages deploy dist --project-name quokkabot-site --branch main --commit-hash "$GITHUB_SHA"
