name: iPhone app (EAS)

# Store builds and over-the-air updates for the iPhone app, on EAS. Without the EXPO_TOKEN secret (forks, a repository
# that has not set it up) every run passes with a note and does nothing.
#
# A push to main that touches the app:
#   1. Store build: when no production build exists yet for the version in app.config.ts, build it and submit it to
#      TestFlight. Bumping `version` starts the next release. Releasing to the App Store stays a manual step.
#   2. Update: publish an over-the-air update to the production channel when a finished build has the same runtime
#      version (the native fingerprint plus the app version, fingerprint.config.js). Updates carry fixes to the
#      reviewed release only; a new feature ships in a new version.
# Manual runs build a profile (production, preview) or publish an update.
#
# Repository variables: QB_EAS_PROJECT_ID and QB_EXPO_OWNER (the EAS project); the App Store Connect API key for
# submissions is stored in EAS, not here.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/shared/**
      - packages/client/**
      - pnpm-lock.yaml
      - .github/workflows/mobile-eas.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "build (a store or internal build) or update (over the air)"
        required: true
        type: choice
        default: build
        options: [build, update]
      profile:
        description: "Build profile (mode build)"
        required: true
        type: choice
        default: production
        options: [production, preview]
      message:
        description: "Update message (mode update)"
        required: false
        type: string

# One run at a time, in merge order, so updates publish in order.
concurrency:
  group: mobile-eas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eas:
    name: EAS ${{ github.event_name == 'push' && 'release' || inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VARIANT: production
      QB_EAS_PROJECT_ID: ${{ vars.QB_EAS_PROJECT_ID }}
      QB_EXPO_OWNER: ${{ vars.QB_EXPO_OWNER }}
    steps:
      - id: token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            [ -n "$QB_EAS_PROJECT_ID" ] && [ -n "$QB_EXPO_OWNER" ] || { echo "::error::EXPO_TOKEN is set, but the QB_EAS_PROJECT_ID and QB_EXPO_OWNER variables are missing."; exit 1; }
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not set; nothing to build or publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build (manual)
        if: steps.token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$PROFILE" = production ]; then
            eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
          else
            APP_VARIANT=preview eas build --platform ios --profile preview --non-interactive --no-wait
          fi

      - name: Update (manual)
        if: steps.token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ inputs.message }}
        run: eas update --channel production --environment production --platform ios --message "${MESSAGE:-Update $GITHUB_SHA}" --non-interactive

      # A build in the queue counts as existing, so merges during a build never start a second one.
      - name: Store build for a new version
        if: steps.token.outputs.present == 'true' && github.event_name == 'push'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          version="$(npx expo config --json --type public | jq -r '.version')"
          latest="$(eas build:list --platform ios --build-profile production --limit 1 --json --non-interactive | jq -r '.[0].appVersion // "none"')"
          if [ "$latest" = "$version" ]; then
            echo "A production build for $version exists." >> "$GITHUB_STEP_SUMMARY"
          else
            eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
            echo "Started the production build and TestFlight submission for $version." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update for builds with this runtime
        if: steps.token.outputs.present == 'true' && github.event_name == 'push'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          hash="$(eas fingerprint:generate --platform ios --environment production --json --non-interactive | sed -n '/^{/,$p' | jq -er '.hash')"
          matching="$(eas build:list --platform ios --build-profile production --status finished --fingerprint-hash "$hash" --limit 1 --json --non-interactive | jq 'length')"
          if [ "$matching" -gt 0 ]; then
            eas update --channel production --environment production --platform ios --message "$(git log -1 --pretty=%s | head -c 120)" --non-interactive
            echo "Published an update for runtime $hash." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No finished build has runtime $hash; the change ships with the next build." >> "$GITHUB_STEP_SUMMARY"
          fi
