name: iPhone app (EAS)

# Store builds for the iPhone app, on EAS. Without the EXPO_TOKEN secret (forks, a repository that has not set it up)
# every run passes with a note and does nothing.
#
# A push to main that touches the app starts a store build when no production build exists yet for the version in
# app.config.ts, and submits it to TestFlight. Bumping `version` starts the next release. Releasing to the App Store
# stays a manual step. The app has no over-the-air updates: every change ships in a reviewed build.
# Manual runs build a profile (production, preview).
#
# Repository variables: QB_EAS_PROJECT_ID and QB_EXPO_OWNER (the EAS project); the App Store Connect API key for
# submissions is stored in EAS, not here.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/shared/**
      - packages/client/**
      - pnpm-lock.yaml
      - .github/workflows/mobile-eas.yml
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        type: choice
        default: production
        options: [production, preview]

# One run at a time, in merge order, so two merges never start two builds of one version.
concurrency:
  group: mobile-eas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eas:
    name: EAS ${{ github.event_name == 'push' && 'release' || inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VARIANT: production
      QB_EAS_PROJECT_ID: ${{ vars.QB_EAS_PROJECT_ID }}
      QB_EXPO_OWNER: ${{ vars.QB_EXPO_OWNER }}
    steps:
      - id: token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            [ -n "$QB_EAS_PROJECT_ID" ] && [ -n "$QB_EXPO_OWNER" ] || { echo "::error::EXPO_TOKEN is set, but the QB_EAS_PROJECT_ID and QB_EXPO_OWNER variables are missing."; exit 1; }
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not set; nothing to build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build (manual)
        if: steps.token.outputs.present == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$PROFILE" = production ]; then
            eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
          else
            APP_VARIANT=preview eas build --platform ios --profile preview --non-interactive --no-wait
          fi

      # A queued, running or finished build of this version counts as existing, so merges during a build never start a
      # second one. An errored or canceled build does not count: the next push builds the version again.
      - name: Store build for a new version
        if: steps.token.outputs.present == 'true' && github.event_name == 'push'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          version="$(npx expo config --json --type public | jq -r '.version')"
          existing="$(eas build:list --platform ios --build-profile production --app-version "$version" --limit 50 --json --non-interactive \
            | jq '[.[] | select(.status != "ERRORED" and .status != "CANCELED" and .status != "PENDING_CANCEL")] | length')"
          if [ "$existing" -gt 0 ]; then
            echo "A production build for $version exists." >> "$GITHUB_STEP_SUMMARY"
          else
            eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
            echo "Started the production build and TestFlight submission for $version." >> "$GITHUB_STEP_SUMMARY"
          fi
